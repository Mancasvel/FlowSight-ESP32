[platformio]
default_envs = cyd
core_dir = .local/platformio

[env:cyd]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 230400
board_build.partitions = min_spiffs.csv
lib_deps =
  lovyan03/LovyanGFX@1.2.7
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D LGFX_USE_V1
  -D FLOWSIGHT_VERSION=\"0.1.0\"
