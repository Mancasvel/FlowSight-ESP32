name: Firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install -r requirements.txt
      - name: Check Python tools
        run: python -m py_compile tools/device.py tools/verify_device.py tools/make_fonts.py
      - name: Check resistive touch gestures
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I include tests/touch_gesture.cpp -o /tmp/flowsight-touch-tests
          /tmp/flowsight-touch-tests
      - name: Build firmware
        run: pio run
      - name: Merge firmware
        run: python tools/merge_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: FlowSight-ESP32
          path: |
            firmware/*.bin
            firmware/SHA256SUMS.txt
